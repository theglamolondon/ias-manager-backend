spring.application.name=ias_manager
#debug=true
server.port=9999

logging.level.root=INFO
logging.level.ci.fer.posservice=INFO
logging.logback.rollingpolicy.max-file-size=30MB

ias.security.secret=ZDc4OWMyMjhkMTM5MDVlMDEyZjlkNTllNTExNjY0ZDc1ZWU1NDY2OWI2ODM0ZDEyYTliYWZlNWM3NGZhYTM1NzIyOWUzZWQwM2RjM2JiNGRhMDA1OTljYzhlMzhiYzZl
# Durée de vie du token d'accès : 1 jour (court, complété par le refresh token).
ias.security.expiration=86400000
# Durée de vie du refresh token : 7 jours.
ias.security.refresh-expiration=604800000
ias.security.issuer= ias-manager-api
# Anti brute-force sur /api/auth/login (S7).
ias.security.login-max-attempts=5
ias.security.login-block-minutes=15

# Origines autorisées pour le CORS (S11), séparées par des virgules.
ias.cors.allowed-origins=http://localhost:5173, http://192.168.10.128:5173

spring.datasource.url=jdbc:mysql://localhost:8889/ias_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

springdoc.swagger-ui.path=/swagger-ui.html

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

ias.media.upload-dir=uploads/medias
